<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="runnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />

  <!-- Grid Perspective Track Lines -->
  <polygon points="120,470 216,190 296,190 392,470" fill="#031024" stroke="#0284c7" stroke-width="3" />
  <line x1="210" y1="470" x2="242" y2="190" stroke="#38bdf8" stroke-width="5" stroke-dasharray="14 10" />
  <line x1="302" y1="470" x2="270" y2="190" stroke="#38bdf8" stroke-width="5" stroke-dasharray="14 10" />
  <line x1="120" y1="470" x2="216" y2="190" stroke="#00f0ff" stroke-width="6" />
  <line x1="392" y1="470" x2="296" y2="190" stroke="#00f0ff" stroke-width="6" />

  <!-- Math Gate Arch at Horizon -->
  <path d="M 195 210 Q 256 160 317 210" fill="none" stroke="#f59e0b" stroke-width="6" />
  <rect x="238" y="152" width="36" height="24" rx="6" fill="#f59e0b" />
  <text x="256" y="169" font-family="sans-serif" font-weight="900" font-size="14" fill="#0f172a" text-anchor="middle">7+8</text>

  <!-- Running Character -->
  <g transform="translate(256, 335) scale(1.15)">
    <ellipse cx="-16" cy="38" rx="7" ry="16" fill="#f97316" />
    <ellipse cx="-16" cy="34" rx="4" ry="10" fill="#fef08a" />
    <ellipse cx="16" cy="38" rx="7" ry="16" fill="#f97316" />
    <ellipse cx="16" cy="34" rx="4" ry="10" fill="#fef08a" />
    <rect x="-22" y="-5" width="44" height="34" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="2.5" />
    <circle cx="0" cy="12" r="6" fill="#00f0ff" />
    <path d="M -22 10 L -15 -35 L 15 -35 L 22 10 Z" fill="url(#runnerGrad)" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="-48" r="18" fill="#1e293b" />
    <path d="M -14 -46 Q 0 -54 14 -46 Q 0 -42 -14 -46 Z" fill="#00f0ff" />
    <path d="M -18 -26 L -36 -6 L -32 14" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 18 -26 L 36 -12 L 30 10" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -10 10 L -22 46 L -32 74" fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="-34" cy="76" rx="10" ry="5" fill="#00f0ff" />
    <path d="M 10 10 L 24 38 L 18 68" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="18" cy="70" rx="9" ry="5" fill="#f59e0b" />
  </g>

  <!-- Math Symbols -->
  <g transform="translate(86, 150) rotate(-12)">
    <circle cx="28" cy="28" r="32" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />
    <line x1="28" y1="12" x2="28" y2="44" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <line x1="12" y1="28" x2="44" y2="28" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  </g>
  <g transform="translate(366, 136) rotate(15)">
    <circle cx="28" cy="28" r="32" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2" />
    <line x1="16" y1="16" x2="40" y2="40" stroke="#fef08a" stroke-width="7" stroke-linecap="round" />
    <line x1="40" y1="16" x2="16" y2="40" stroke="#fef08a" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(256, 462)">
    <rect x="-140" y="-22" width="280" height="40" rx="14" fill="#020617" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="5" font-family="'Cairo', system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">
      MATH RUN <tspan fill="#f59e0b">3D</tspan>
    </text>
  </g>
</svg>
